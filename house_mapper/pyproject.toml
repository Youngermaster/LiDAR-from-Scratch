[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "house-mapper"
version = "0.1.0"
description = "A small real-time 2D mapping tool for the RPLIDAR C1."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Youngermaster" }]
license = { text = "MIT" }
dependencies = [
    "pyserial>=3.5,<4.0",
    "numpy>=1.26,<3.0",
    "scipy>=1.11,<2.0",
    "pygame>=2.5,<3.0",
    "Pillow>=10.0,<12.0",
]

[tool.setuptools.packages.find]
include = ["house_mapper*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
